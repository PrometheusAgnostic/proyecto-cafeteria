spring.application.name=cafeteria-api
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/cafeteria}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:cafeteria}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:cafeteria}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false