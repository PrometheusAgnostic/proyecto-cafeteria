services:
  app:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    volumes:
      - .:/workspace:cached
    command: sleep infinity
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/cafeteria
      SPRING_DATASOURCE_USERNAME: cafeteria
      SPRING_DATASOURCE_PASSWORD: cafeteria

  postgres:
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: cafeteria
      POSTGRES_USER: cafeteria
      POSTGRES_PASSWORD: cafeteria
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cafeteria -d cafeteria"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data: